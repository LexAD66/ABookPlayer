name: Release Build

on:
  # Neues Release: Tag pushen, z. B. `git tag v2.0.1 && git push origin v2.0.1`
  push:
    tags:
      - 'v*'
  # Prüft bei Änderungen am Release-Build nur, ob die Release-APK baut (ohne Veröffentlichung)
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'ABookPlayer/app/build.gradle.kts'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x ABookPlayer/gradlew
          chmod +x ABookPlayer/gradle/wrapper/gradle-wrapper || true

      # Release-Schlüssel aus Repository-Secrets. Ein fester Schlüssel ist Pflicht für Veröffentlichungen,
      # sonst lassen sich spätere APKs nicht als Update über frühere installieren.
      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ABOOK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ABOOK_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release-Keystore gefunden, APK wird damit signiert."
          elif [ "$PUBLISH" = "true" ]; then
            echo "::error::Secret ABOOK_KEYSTORE_BASE64 fehlt. Ohne festen Release-Schlüssel wird kein Release veröffentlicht."
            exit 1
          else
            echo "Kein Release-Keystore (PR-Prüfung), APK bleibt unsigniert."
          fi

      - name: Run Unit Tests
        run: |
          cd ABookPlayer
          ./gradlew test --stacktrace

      - name: Assemble Release APK
        env:
          ABOOK_KEYSTORE_PASSWORD: ${{ secrets.ABOOK_KEYSTORE_PASSWORD }}
          ABOOK_KEY_ALIAS: ${{ secrets.ABOOK_KEY_ALIAS }}
          ABOOK_KEY_PASSWORD: ${{ secrets.ABOOK_KEY_PASSWORD }}
        run: |
          cd ABookPlayer
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp ABookPlayer/app/build/outputs/apk/release/*.apk "dist/ABookPlayer-${RELEASE_TAG}.apk"
          ls -l dist

      - name: Upload APK (Workflow-Artefakt)
        uses: actions/upload-artifact@v4
        with:
          name: ABookPlayer-${{ env.RELEASE_TAG }}
          path: dist/*.apk

      - name: Create GitHub Release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "ABook Player ${{ env.RELEASE_TAG }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
