name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x ABookPlayer/gradlew
          chmod +x ABookPlayer/gradle/wrapper/gradle-wrapper || true

      # Release-Schlüssel aus Secrets, falls hinterlegt; sonst Fallback auf Debug-Signatur,
      # damit die Release-APK direkt auf Android-Geräten installierbar ist.
      - name: Configure Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ABOOK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ABOOK_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release-Keystore gefunden, APK wird damit signiert."
          else
            echo "Kein Release-Keystore hinterlegt, Fallback auf Debug-Schlüssel für direkte Installation."
            echo "ABOOK_SIGN_WITH_DEBUG=true" >> "$GITHUB_ENV"
          fi

      - name: Run Unit Tests
        run: |
          cd ABookPlayer
          ./gradlew test --stacktrace

      - name: Assemble Release APK
        env:
          ABOOK_KEYSTORE_PASSWORD: ${{ secrets.ABOOK_KEYSTORE_PASSWORD }}
          ABOOK_KEY_ALIAS: ${{ secrets.ABOOK_KEY_ALIAS }}
          ABOOK_KEY_PASSWORD: ${{ secrets.ABOOK_KEY_PASSWORD }}
        run: |
          cd ABookPlayer
          ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p dist
          cp ABookPlayer/app/build/outputs/apk/release/*.apk "dist/ABookPlayer-${{ github.ref_name }}.apk"
          ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ABook Player ${{ github.ref_name }}"
          body_path: fastlane/metadata/android/de-DE/changelogs/302.txt
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
